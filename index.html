<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基本電學 - 抽卡特訓班 (AI 診斷完整版)</title>
    <script> window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } }; </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>

    <style>
        body { font-family: '微軟正黑體', sans-serif; background-color: #1a1a2e; color: #ecf0f1; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; transition: background-color 0.5s ease; }
        body.rescue-mode { background-color: #4a1010; }
        .container { background-color: #2c3e50; width: 90%; max-width: 650px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; max-height: 90vh; overflow-y: auto; }
        h1 { color: #f1c40f; margin-bottom: 5px; }
        .subtitle { color: #95a5a6; margin-bottom: 20px; font-size: 14px; }
        .warning-box { background-color: #c0392b; color: white; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; font-size: 14px; border: 2px solid #e74c3c; }
        .btn { display: block; width: 100%; padding: 15px; margin-bottom: 15px; font-size: 18px; cursor: pointer; border: none; border-radius: 8px; background-color: #34495e; color: white; font-weight: bold; transition: 0.2s; }
        .btn:hover { background-color: #3498db; }
        .btn-start { background-color: #27ae60; }
        .btn-collection { background-color: #8e44ad; }
        .pack-grid { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        .pack-option { background: #2c3e50; border: 2px solid #34495e; padding: 10px 15px; cursor: pointer; border-radius: 8px; color: #cbd5e1; }
        .pack-option.active { background: #2980b9; border-color: #3498db; color: #fff; }
        #game-area, #result-area, #gacha-overlay, #collection-modal { display: none; }
        .tag { display: inline-block; background: #e74c3c; color: white; padding: 5px 10px; border-radius: 5px; margin-bottom: 15px; }
        .question-text { font-size: 20px; line-height: 1.5; margin-bottom: 20px; }
        #ai-feedback-box { margin-top: 20px; padding: 15px; border: 2px dashed #9b59b6; border-radius: 8px; background: rgba(155, 89, 182, 0.1); color: #ecf0f1; text-align: left; }
    </style>
</head>
<body>

    <div id="gacha-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); display:none; justify-content:center; align-items:center; flex-direction:column; z-index:200;">
        <h2 id="gacha-title">✨ 連擊達成！獲得抽卡機會！ ✨</h2>
        <button id="pre-draw-btn" class="btn" style="width:200px;" onclick="executeDraw()">點擊抽卡</button>
        <div id="revealed-card" style="display:none; padding:20px; border:2px solid #fff; border-radius:10px;">
            <div id="card-name" style="font-size:24px;">卡片名稱</div>
        </div>
        <button id="post-draw-btn" class="btn" style="width:200px; display:none;" onclick="closeGacha()">收下卡片並繼續</button>
    </div>

    <div id="collection-modal">
        <h2 class="collection-header" id="collection-title">🏆 專屬集卡冊</h2>
        <div id="collection-content" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
        <button class="close-btn" onclick="document.getElementById('collection-modal').style.display='none'">返回首頁</button>
    </div>

    <div class="container">
        <div id="student-setup">
            <h1>🎒 程式設計特訓班</h1>
            <div class="warning-box">⚠️ 注意：請先輸入姓名並點擊【☁️ 載入雲端圖鑑】，否則紀錄會洗掉！</div>
            <input type="text" id="student-name" placeholder="請輸入 班級+座號+姓名" style="width:80%; padding:10px; margin-bottom:20px;">
            <div class="pack-grid" id="pack-selector"></div>
            <button class="btn" id="btn-sync" onclick="syncCloudData()">☁️ 1. 載入雲端圖鑑存檔</button>
            <button class="btn btn-start" onclick="startGame()">▶️ 2. 開始挑戰</button>
            <button class="btn btn-collection" onclick="openCollection()">📖 查看圖鑑</button>
        </div>

        <div id="game-area">
            <div class="tag" id="q-tag">第 1 關</div>
            <div class="question-text" id="q-text">題目載入中...</div>
            <div id="options-area"></div>
        </div>

        <div id="result-area">
            <h1>測驗完成！🎉</h1>
            <div id="log-report"></div>
            <button class="btn" onclick="location.reload()">返回首頁</button>
        </div>
    </div>

    <script>
        // --- 完整卡包與題庫定義 ---
        const cardPacks = {
            "phase1": { name: "⚡ 第一階段", cards: [{ id: "c1", name: "【UR】洛奇亞", rarity: "UR", chance: 5, image: "" }, { id: "c14", name: "【N】小山豬", rarity: "N", chance: 95, image: "" }] },
            "phase2": { name: "🏀 第二階段", cards: [{ id: "n_u1", name: "【UR】Jokić", rarity: "UR", chance: 5, image: "" }, { id: "n_n1", name: "【N】國動", rarity: "N", chance: 95, image: "" }] },
            "phase3": { name: "🔮 第三階段", cards: [{ id: "p3_ur1", name: "【UR】五條悟", rarity: "UR", chance: 5, image: "" }, { id: "p3_n1", name: "【N】夜姬", rarity: "N", chance: 95, image: "" }] },
            "phase4": { name: "⚔️ 第四階段", cards: [{ id: "p4_u1", name: "【UR】諸葛亮", rarity: "UR", chance: 5, image: "" }, { id: "p4_n1", name: "【N】李典", rarity: "N", chance: 95, image: "" }] }
        };

        const quizData = {
            "q1": { tag: "第 1 關", text: "RLC 諧振時 XL 與 XC 關係？", options: [{text: "A. XL=XC", next: "q2", isCorrect: true}, {text: "B. XL>XC", next: "q1_help"}] },
            "q1_help": { tag: "💊 救援任務", text: "諧振時 XL=XC。", options: [{text: "A. XL=XC", next: "q1", isCorrect: true}] },
            "q2": { tag: "第 2 關", text: "串聯諧振時阻抗為？", options: [{text: "A. 最小", next: "end", isCorrect: true}, {text: "B. 最大", next: "q2_help", log: "Q2錯: 串聯諧振阻抗最小"}] },
            "q2_help": { tag: "💊 救援任務", text: "諧振阻抗最小。", options: [{text: "A. 最小", next: "q2", isCorrect: true}] }
        };

        let studentName = "", currentStep = "q1", hp = 30, sessionCards = [], diagnosticLogs = [], failedQuestions = [], startTime = 0, rescueTriggered = 0, rescueFails = 0, currentStreak = 0, currentPackId = "phase4";

        // --- 核心邏輯 ---
        function startGame() {
            studentName = document.getElementById('student-name').value.replace(/\s+/g, '');
            if (!studentName) { alert("請輸入姓名！"); return; }
            startTime = Date.now();
            document.getElementById('student-setup').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            renderQuestion();
        }

        function handleAnswer(opt) {
            let isRescue = currentStep.includes("_help");
            if (!opt.isCorrect) {
                if (opt.log) diagnosticLogs.push(opt.log);
                if (!isRescue) rescueTriggered++; else rescueFails++;
                currentStreak = 0;
                currentStep = opt.next;
                renderQuestion();
            } else {
                if (!isRescue) currentStreak++;
                if (currentStreak >= 2) { prepareGacha(opt.next); } else { currentStep = opt.next; renderQuestion(); }
            }
        }

        function prepareGacha(nextStep) {
            document.getElementById('gacha-overlay').style.display = "flex";
            document.getElementById('post-draw-btn').onclick = () => { document.getElementById('gacha-overlay').style.display = 'none'; currentStreak = 0; currentStep = nextStep; renderQuestion(); };
        }

        function executeDraw() {
            document.getElementById('pre-draw-btn').style.display = 'none';
            let card = { name: "【SSR】測試卡", rarity: "SSR" }; 
            sessionCards.push(card.name);
            document.getElementById('revealed-card').style.display = 'flex';
            document.getElementById('post-draw-btn').style.display = 'block';
        }

        function finishGame() {
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
            let totalTime = Math.round((Date.now() - startTime) / 1000);
            document.getElementById('log-report').innerHTML = `耗時 ${totalTime} 秒<div id="ai-feedback-box">🤖 AI 導師分析中...</div>`;
            
            let formData = new URLSearchParams();
            formData.append('name', studentName);
            formData.append('hp', hp);
            formData.append('time', totalTime);
            formData.append('rescueTriggered', rescueTriggered);
            formData.append('rescueFails', rescueFails);
            formData.append('errorCount', diagnosticLogs.length);
            formData.append('errorDetails', diagnosticLogs.join(" | "));
            formData.append('cards', sessionCards.join(","));
            formData.append('fullCollection', localStorage.getItem("gachaCollection_" + studentName) || "[]");
            
            fetch(scriptURL, { method: 'POST', body: formData })
            .then(res => res.text())
            .then(aiText => document.getElementById('ai-feedback-box').innerHTML = `<strong>AI 導師建議：</strong> ${aiText}`);
        }

        const scriptURL = 'https://script.google.com/macros/s/AKfycbwQnum1bAGvOb-dv5hL08S0pzMB93_gN0ZmoqCQtUjKFYOT-vs8Df0iTT6OMpx_sb6pjg/exec';
        async function syncCloudData() { alert("同步中..."); }
        function closeGacha() { document.getElementById('gacha-overlay').style.display = 'none'; }
        
        // 渲染卡包與初始化
        document.addEventListener('DOMContentLoaded', () => {
            const selector = document.getElementById('pack-selector');
            Object.keys(cardPacks).forEach(key => {
                const div = document.createElement('div');
                div.className = `pack-option ${key === currentPackId ? 'active' : ''}`;
                div.innerText = cardPacks[key].name;
                div.onclick = () => { currentPackId = key; document.querySelectorAll('.pack-option').forEach(o=>o.classList.remove('active')); div.classList.add('active'); };
                selector.appendChild(div);
            });
        });
    </script>
</body>
</html>
